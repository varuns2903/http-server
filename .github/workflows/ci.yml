name: Orbit CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build & Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
    - uses: actions/checkout@v3
      with:
        submodules: recursive

    - name: Install Dependencies (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      env:
        PKG_CONFIG_PATH: /usr/local/ssl/lib/pkgconfig
        OPENSSL_ROOT_DIR: /usr/local/ssl
        LD_LIBRARY_PATH: /usr/local/ssl/lib
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake g++ libpq-dev libhiredis-dev pkg-config zlib1g-dev
        sudo apt-get install -y libnghttp2-dev liburing-dev

        # Ubuntu's system OpenSSL lacks QUIC support. Build OpenSSL 3.3.1.
        wget https://github.com/openssl/openssl/releases/download/openssl-3.3.1/openssl-3.3.1.tar.gz
        tar -xzf openssl-3.3.1.tar.gz
        cd openssl-3.3.1
        ./config --prefix=/usr/local/ssl --libdir=lib no-tests
        make -j$(nproc)
        sudo make install_sw
        cd ..
        echo "/usr/local/ssl/lib" | sudo tee /etc/ld.so.conf.d/openssl.conf
        sudo ldconfig
        
        echo "LD_LIBRARY_PATH=/usr/local/ssl/lib:$LD_LIBRARY_PATH" >> $GITHUB_ENV
        echo "PKG_CONFIG_PATH=/usr/local/ssl/lib/pkgconfig:$PKG_CONFIG_PATH" >> $GITHUB_ENV
        echo "OPENSSL_ROOT_DIR=/usr/local/ssl" >> $GITHUB_ENV

        # Build nghttp3
        git clone --depth 1 --branch v1.6.0 https://github.com/ngtcp2/nghttp3.git
        cd nghttp3
        git submodule update --init
        mkdir build && cd build
        cmake -DCMAKE_INSTALL_PREFIX=/usr -DENABLE_LIB_ONLY=ON -DCMAKE_BUILD_TYPE=Release ..
        make -j$(nproc)
        sudo make install
        cd ../..

        # Build ngtcp2 with OpenSSL 3.3
        git clone --depth 1 --branch v1.9.1 https://github.com/ngtcp2/ngtcp2.git
        cd ngtcp2
        git submodule update --init
        mkdir build && cd build
        PKG_CONFIG_PATH="/usr/local/ssl/lib/pkgconfig:$PKG_CONFIG_PATH" \
        CFLAGS="-I/usr/local/ssl/include" \
        CXXFLAGS="-I/usr/local/ssl/include" \
        LDFLAGS="-L/usr/local/ssl/lib -Wl,-rpath,/usr/local/ssl/lib" \
        cmake -DCMAKE_INSTALL_PREFIX=/usr \
              -DENABLE_LIB_ONLY=ON \
              -DCMAKE_BUILD_TYPE=Release \
              -DENABLE_OPENSSL=ON \
              -DOPENSSL_ROOT_DIR=/usr/local/ssl \
              -DOPENSSL_INCLUDE_DIR=/usr/local/ssl/include \
              -DOPENSSL_CRYPTO_LIBRARY=/usr/local/ssl/lib/libcrypto.so \
              -DOPENSSL_SSL_LIBRARY=/usr/local/ssl/lib/libssl.so \
              -DHAVE_SSL_PROVIDE_QUIC_DATA=1 \
              ..
        make -j$(nproc)
        sudo make install
        cd ../..

        # Debug: verify .pc files installed
        echo "--- Installed ngtcp2 .pc files ---"
        find /usr -name "libngtcp2*.pc" 2>/dev/null
        pkg-config --modversion libngtcp2_crypto_ossl || echo "WARN: libngtcp2_crypto_ossl .pc not found"

    - name: Install Dependencies (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        brew install cmake openssl libpq hiredis pkg-config nghttp2 libngtcp2 libnghttp3 zlib

    - name: Configure CMake (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: |
        mkdir -p build && cd build
        export PKG_CONFIG_PATH="/usr/local/ssl/lib/pkgconfig:$PKG_CONFIG_PATH"
        cmake -DCMAKE_BUILD_TYPE=Release \
              -DOPENSSL_ROOT_DIR=/usr/local/ssl \
              ..

    - name: Configure CMake (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        mkdir -p build && cd build
        export PKG_CONFIG_PATH="$(brew --prefix openssl)/lib/pkgconfig:$(brew --prefix libpq)/lib/pkgconfig:$(brew --prefix libngtcp2)/lib/pkgconfig:$(brew --prefix libnghttp3)/lib/pkgconfig:$(brew --prefix nghttp2)/lib/pkgconfig:$(brew --prefix hiredis)/lib/pkgconfig:$PKG_CONFIG_PATH"
        cmake -DCMAKE_BUILD_TYPE=Release \
          -DOPENSSL_ROOT_DIR=$(brew --prefix openssl) \
          -DPostgreSQL_ROOT=$(brew --prefix libpq) \
          -DCMAKE_PREFIX_PATH="$(brew --prefix openssl);$(brew --prefix libpq);$(brew --prefix libngtcp2);$(brew --prefix libnghttp3);$(brew --prefix nghttp2);$(brew --prefix hiredis);$(brew --prefix zlib)" \
          ..

    - name: Build Framework
      run: |
        cd build
        make -j$(nproc 2>/dev/null || sysctl -n hw.ncpu)

    - name: Run Tests
      run: |
        cd build
        ./http_server_tests
