name: Orbit CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build & Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
    - uses: actions/checkout@v3
      with:
        submodules: recursive

    - name: Install Dependencies (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake g++ libpq-dev libhiredis-dev pkg-config zlib1g-dev
        sudo apt-get install -y libnghttp2-dev liburing-dev

        # Ubuntu's system OpenSSL lacks QUIC support. Build quictls/openssl.
        git clone --depth 1 --branch openssl-3.1.7+quic https://github.com/quictls/openssl.git quictls-openssl
        cd quictls-openssl
        ./config --prefix=/usr/local/quictls --libdir=lib no-tests
        make -j$(nproc)
        sudo make install_sw
        cd ..
        echo "/usr/local/quictls/lib" | sudo tee /etc/ld.so.conf.d/quictls.conf
        sudo ldconfig

        # Build nghttp3
        git clone --depth 1 --branch v1.6.0 https://github.com/ngtcp2/nghttp3.git
        cd nghttp3
        git submodule update --init
        mkdir build && cd build
        cmake -DCMAKE_INSTALL_PREFIX=/usr -DENABLE_LIB_ONLY=ON -DCMAKE_BUILD_TYPE=Release ..
        make -j$(nproc)
        sudo make install
        cd ../..

        # Build ngtcp2 with quictls — set PKG_CONFIG_PATH so it finds quictls
        export PKG_CONFIG_PATH="/usr/local/quictls/lib/pkgconfig:$PKG_CONFIG_PATH"
        git clone --depth 1 --branch v1.9.1 https://github.com/ngtcp2/ngtcp2.git
        cd ngtcp2
        git submodule update --init
        mkdir build && cd build
        cmake -DCMAKE_INSTALL_PREFIX=/usr \
              -DENABLE_LIB_ONLY=ON \
              -DCMAKE_BUILD_TYPE=Release \
              -DENABLE_OPENSSL=ON \
              -DOPENSSL_ROOT_DIR=/usr/local/quictls \
              -DCMAKE_FIND_ROOT_PATH=/usr/local/quictls \
              ..
        make -j$(nproc)
        sudo make install
        cd ../..

        # Verify the .pc file was installed
        pkg-config --modversion libngtcp2_crypto_ossl || echo "WARNING: libngtcp2_crypto_ossl not found"

    - name: Install Dependencies (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        brew install cmake openssl libpq hiredis pkg-config nghttp2 libngtcp2 libnghttp3 zlib

    - name: Configure CMake (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: |
        mkdir -p build && cd build
        cmake -DCMAKE_BUILD_TYPE=Release \
              -DOPENSSL_ROOT_DIR=/usr/local/quictls \
              ..

    - name: Configure CMake (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        mkdir -p build && cd build
        export PKG_CONFIG_PATH="$(brew --prefix openssl)/lib/pkgconfig:$(brew --prefix libpq)/lib/pkgconfig:$(brew --prefix libngtcp2)/lib/pkgconfig:$(brew --prefix libnghttp3)/lib/pkgconfig:$(brew --prefix nghttp2)/lib/pkgconfig:$(brew --prefix hiredis)/lib/pkgconfig:$PKG_CONFIG_PATH"
        cmake -DCMAKE_BUILD_TYPE=Release \
          -DOPENSSL_ROOT_DIR=$(brew --prefix openssl) \
          -DPostgreSQL_ROOT=$(brew --prefix libpq) \
          -DCMAKE_PREFIX_PATH="$(brew --prefix openssl);$(brew --prefix libpq);$(brew --prefix libngtcp2);$(brew --prefix libnghttp3);$(brew --prefix nghttp2);$(brew --prefix hiredis);$(brew --prefix zlib)" \
          ..

    - name: Build Framework
      run: |
        cd build
        make -j$(nproc 2>/dev/null || sysctl -n hw.ncpu)

    - name: Run Tests
      run: |
        cd build
        ./http_server_tests
